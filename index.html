<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoamAI - 台灣智慧旅遊行程規劃器</title>
  <meta name="description" content="單一提示詞 AI 旅遊行程規劃器，專為台灣國內旅遊打造，自動生成每日時間軸、互動地圖、預算分析與行李檢查表。">

  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RoamAI 旅遊">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet Map CSS & JS (OpenStreetMap) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- App Styles -->
  <link rel="stylesheet" href="styles/design-tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="header">
    <div class="brand-logo">
      <div class="brand-icon">🗺️</div>
      <div>
        <span class="gradient-text">RoamAI</span>
        <span style="font-size: 0.8rem; font-weight: 500; color: var(--text-muted); margin-left: 4px;">台灣極簡規劃</span>
      </div>
    </div>
    
    <div class="nav-actions">
      <button class="btn btn-secondary" id="favorites-btn" title="查看已收藏行程">
        <span>⭐ 我的收藏</span>
      </button>
      <button class="btn btn-secondary" id="api-key-btn" title="設定 API 金鑰">
        <span>🔑 API 金鑰</span>
      </button>
      <button class="btn-icon" id="theme-btn" title="切換深淺主題">
        🌙
      </button>
    </div>
  </header>

  <!-- Hero Prompt Section -->
  <main>
    <section class="hero-section">
      <h1 class="hero-title">
        一句話，規畫你的 <span class="gradient-text">台灣夢幻之旅</span>
      </h1>
      <p class="hero-subtitle">
        輸入旅遊需求提示詞，AI 立即生成每日時間軸、景點地圖、預算估算與行李清單。
      </p>

      <!-- Single Prompt Input Box -->
      <div class="prompt-box-container">
        <textarea 
          id="prompt-input" 
          class="prompt-textarea" 
          placeholder="例如：下個月想去台南 3 天 2 夜小吃與古蹟巡禮，偏好放慢腳步，兩人同行，預算一萬台幣..."
        ></textarea>
        <button id="generate-btn" class="btn btn-primary btn-generate">
          <span>✨ 智慧生成行程</span>
        </button>
      </div>

      <!-- Quick Taiwan Preset Chips -->
      <div id="preset-chips" class="chips-container"></div>
    </section>

    <!-- Main Dashboard Workspace -->
    <section id="dashboard" class="dashboard-container dashboard-hidden">
      <!-- Trip Summary Header Card -->
      <div class="trip-summary-card glass-panel animate-fade-in">
        <div>
          <h2 id="trip-title" class="trip-title">行程名稱</h2>
          <div id="trip-meta" class="trip-meta"></div>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button id="bookmark-trip-btn" class="btn btn-secondary">
            ⭐ 收藏行程
          </button>
          <button id="export-ics-btn" class="btn btn-secondary">
            📅 匯出至行事曆 (.ics)
          </button>
          <button id="share-btn" class="btn btn-secondary">
            📋 複製分享文字
          </button>
        </div>
      </div>

      <!-- View Switcher Tabs -->
      <nav class="view-tabs">
        <button id="tab-timeline" class="tab-btn active">
          <span>🗓️ 行程時間軸</span>
        </button>
        <button id="tab-map" class="tab-btn">
          <span>🗺️ 全景地圖</span>
        </button>
        <button id="tab-checklist" class="tab-btn">
          <span>🎒 行前須知與清單</span>
        </button>
      </nav>

      <!-- View Panels -->
      <div id="panel-timeline" class="view-panel active"></div>
      
      <div id="panel-map" class="view-panel">
        <!-- Map day selector dynamically injected here by JS -->
        <div class="map-container-wrapper">
          <div id="map"></div>
        </div>
      </div>

      <div id="panel-checklist" class="view-panel"></div>

      <!-- AI Re-Prompt Assistant Bar -->
      <div class="glass-panel" style="margin-top: 2rem; padding: 1rem 1.5rem; display: flex; gap: 12px; align-items: center;">
        <span style="font-size: 1.2rem;">💬</span>
        <input 
          id="reprompt-input" 
          type="text" 
          placeholder="覺得行程需要調整？輸入微調要求（例如：『把第二天下號改為雨天室內備案』）..." 
          style="flex: 1; padding: 8px 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); color: var(--text-main);"
        >
        <button id="reprompt-btn" class="btn btn-primary" style="padding: 8px 16px;">
          AI 微調行程
        </button>
      </div>
    </section>
  </main>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Gemini AI 正在為您規劃台灣行程...</div>
    <div class="loading-subtext">正在計算最適景點路線與在地美食推薦 🍜</div>
  </div>

  <!-- API Key Setup Modal Dialog -->
  <div id="api-key-modal" class="modal-backdrop">
    <div class="modal-dialog glass-panel">
      <div class="modal-header">
        <h3 style="font-size: 1.25rem;">🔑 設定 Google AI Studio API Key</h3>
        <button id="close-api-key-btn" style="font-size: 1.5rem; color: var(--text-muted);">&times;</button>
      </div>
      <div style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1rem;">
        請輸入您的 Google AI Studio API 金鑰。金鑰將安全地保存在您本機瀏覽器的 LocalStorage 中，不會上傳至任何第三方伺服器。
      </div>
      <input 
        type="password" 
        id="api-key-input" 
        placeholder="AIzaSy..." 
        style="width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); margin-bottom: 1rem; font-family: monospace; color: var(--text-main);"
      >
      <div style="font-size: 0.75rem; color: var(--accent-cyan); margin-bottom: 1rem;">
        若未輸入金鑰，系統將以預設的「台北 3 天 2 夜文青美食巡禮」演示資料進行展示。
      </div>
      <div class="modal-footer">
        <button id="save-api-key-btn" class="btn btn-primary">儲存設定</button>
      </div>
    </div>
  </div>

  <!-- Favorites List Modal Dialog -->
  <div id="favorites-modal" class="modal-backdrop">
    <div class="modal-dialog glass-panel" style="max-width: 680px;">
      <div class="modal-header">
        <h3 style="font-size: 1.25rem;">⭐ 我的收藏行程</h3>
        <button id="close-favorites-btn" style="font-size: 1.5rem; color: var(--text-muted);">&times;</button>
      </div>
      <div id="favorites-list-container" style="max-height: 420px; overflow-y: auto; margin: 1rem 0;">
        <!-- Favorite items dynamically rendered -->
      </div>
      <div class="modal-footer">
        <button id="clear-favorites-btn" class="btn btn-secondary" style="color: var(--accent-rose);">清空所有收藏</button>
      </div>
    </div>
  </div>

  <!-- Entry Script (Standalone Bundle for file:// compatibility) -->
  <script src="js/bundle.js"></script>
</body>
</html>
